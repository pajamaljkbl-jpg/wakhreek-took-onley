name: Build Wakhreek Native Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-native/**'
      - '.github/workflows/android-native-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build native debug APK
        working-directory: android-native
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload native APK
        uses: actions/upload-artifact@v4
        with:
          name: wakhreek-native-apk
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
