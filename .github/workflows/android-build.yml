# Clean rebuild trigger after package-lock regeneration
name: Build Wakhreek Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'assets/icon-only.png'
      - 'assets/splash.png'
      - 'public/manifest.json'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Wakhreek dependencies
        run: npm ci

      - name: Verify Capacitor versions
        run: |
          npm ls @capacitor/core @capacitor/cli @capacitor/android
          npx cap --version

      - name: Create and sync Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Apply official Wakhreek Android icon and splash
        run: |
          test -f assets/icon-only.png
          test -f assets/splash.png
          sudo apt-get update
          sudo apt-get install -y imagemagick
          for spec in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            density="${spec%%:*}"
            size="${spec##*:}"
            dir="android/app/src/main/res/mipmap-${density}"
            mkdir -p "$dir"
            convert assets/icon-only.png -resize "${size}x${size}" "$dir/ic_launcher.png"
            convert assets/icon-only.png -resize "${size}x${size}" "$dir/ic_launcher_round.png"
            convert assets/icon-only.png -resize "${size}x${size}" "$dir/ic_launcher_foreground.png"
          done
          mkdir -p android/app/src/main/res/drawable
          convert assets/splash.png -resize 2732x2732 android/app/src/main/res/drawable/splash.png

      - name: Build test APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Android App Bundle
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wakhreek-android-build
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
