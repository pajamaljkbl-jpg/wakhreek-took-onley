name: Generate Wakhreek Brand Assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/brand-assets.yml'

permissions:
  contents: write

jobs:
  generate-brand-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Materialize approved Wakhreek logo source
        shell: bash
        run: |
          mkdir -p assets public
          cat > /tmp/wakhreek-logo.b64 <<'EOF'
[... ELLIPSIZATION ...]
EOF
          base64 -d /tmp/wakhreek-logo.b64 > assets/wakhreek-brand.jpg

      - name: Generate single-source icon and splash masters
        run: |
          convert assets/wakhreek-brand.jpg -crop 380x380+66+0 +repage -resize 1024x1024 assets/icon-only.png
          convert assets/wakhreek-brand.jpg -resize 2732x2732 assets/splash.png
          convert assets/icon-only.png -resize 192x192 public/icon-192.png
          convert assets/icon-only.png -resize 512x512 public/icon-512.png
          convert assets/icon-only.png -resize 64x64 public/favicon.ico

      - name: Update PWA manifest to official Wakhreek icons
        run: |
          python3 - <<'PY'
          import json
          p='public/manifest.json'
          with open(p, encoding='utf-8') as f:
              data=json.load(f)
          data['icons']=[
              {'src':'/icon-192.png','sizes':'192x192','type':'image/png','purpose':'any maskable'},
              {'src':'/icon-512.png','sizes':'512x512','type':'image/png','purpose':'any maskable'}
          ]
          with open(p,'w',encoding='utf-8') as f:
              json.dump(data,f,ensure_ascii=False,indent=2)
              f.write('\n')
          PY

      - name: Commit official Wakhreek brand assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/wakhreek-brand.jpg assets/icon-only.png assets/splash.png public/icon-192.png public/icon-512.png public/favicon.ico public/manifest.json
          git commit -m "Apply official Wakhreek logo across web assets"
          git push
