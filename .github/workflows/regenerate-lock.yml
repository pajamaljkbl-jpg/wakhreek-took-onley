name: Regenerate package lock

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/regenerate-lock.yml'

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate package-lock.json
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify Capacitor lock entries
        run: npm ls @capacitor/core @capacitor/cli @capacitor/android --package-lock-only

      - name: Commit regenerated package-lock.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already up to date"
          else
            git commit -m "Regenerate package-lock for Capacitor 8.4.2"
            git push
          fi
